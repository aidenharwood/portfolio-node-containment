name: "[containment] Test, build and push Docker image"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: aidenharwood/portfolio/containment:${{ github.run_id }}-${{ github.run_number }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: aidenharwood/portfolio-action-docker-build-push@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          image_name: ${{ env.IMAGE_NAME }}
          dockerfile: Dockerfile
          context: .

  update_helm_chart:
    name: Update Helm chart with new image reference
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.event_name != 'pull_request'
    steps:
      - uses: aidenharwood/portfolio-action-helm-update-image@v1
        with:
          target_repo: aidenharwood/portfolio-helm-website
          repo_token: ${{ secrets.GH_PAT }}
          registry: ghcr.io
          image_name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          yaml_file: templates/containment/application.portfolio-containment.yaml
          yaml_path: .spec.template.spec.containers[0].image
